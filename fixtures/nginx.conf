server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # .eml is not in nginx's mime map, so it would be served as application/octet-stream and a
    # browser would download it instead of showing it. text/plain makes the corpus readable in a
    # browser and readable by an HTTP probe with no special handling, which is the point of serving
    # it over HTTP at all.
    location /messages/ {
        default_type text/plain;
        autoindex on;
    }

    # The MTA-STS policy. RFC 8461 requires text/plain and requires the fetch to be over HTTPS from
    # mta-sts.<domain>; this serves it over plain HTTP on a fixture port instead, because a trusted
    # certificate chain for a .test name is not something anybody should have to arrange to try a
    # lab. The DNS half of the check, the _mta-sts TXT record, is fully faithful. See the README.
    location /.well-known/ {
        default_type text/plain;
        autoindex on;
    }

    location / {
        autoindex on;
    }
}
